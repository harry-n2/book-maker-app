<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Maker ── 4ステップで電子書籍を作成</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Book Maker</h1>
  <p class="lead">テーマを書くだけで、Kindle 入稿可能な電子書籍を作成します。</p>
</header>

<main>
  <section id="form-section">
    <h2>4つだけ教えてください</h2>
    <form id="book-form">
      <label class="field">
        <span class="num">1</span>
        <span class="label-title">どんな本を作りますか？</span>
        <span class="hint">テーマを1〜2行で書いてください。具体的なほど良い本が出ます。</span>
        <textarea id="theme" name="theme" rows="3" required
          placeholder="例：AIエージェント×フォルダ設計で副業を月100万円まで仕組み化する方法"></textarea>
      </label>

      <label class="field">
        <span class="num">2</span>
        <span class="label-title">読者は誰ですか？</span>
        <span class="hint">あてはまるものを1つ選んでください。</span>
        <select id="target_layer" name="target_layer" required>
          <option value="大手企業の中堅幹部（45歳前後・年収1,000〜1,500万・組織依存からの脱却を考えている方）">大手企業の中堅幹部の方</option>
          <option value="専門職・士業（コンサル・税理士・弁護士・エンジニア等。労働時間×単価の天井に悩む方）">専門職・士業の方</option>
          <option value="経営者・個人事業主（年商の壁・自分が動かないと止まる構造を卒業したい方）">経営者・個人事業主の方</option>
          <option value="副業1〜3年目の30代会社員（実績はあるが伸び悩んでいる方）">副業1〜3年目の方</option>
          <option value="フリーランス・受託（マーケ・開発の混合受託で次のステージを探す方）">フリーランス・受託の方</option>
        </select>
      </label>

      <label class="field">
        <span class="num">3</span>
        <span class="label-title">著者名（ペンネーム可）</span>
        <span class="hint">書籍の著者として表示される名前です。</span>
        <input type="text" id="author" name="author" required placeholder="例：ハリー">
      </label>

      <label class="field">
        <span class="num">4</span>
        <span class="label-title">Gemini API キー</span>
        <span class="hint">
          <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a>
          で無料で取得できます。コピーして貼り付けてください。
        </span>
        <input type="password" id="api_key" name="api_key" required placeholder="AIzaSy...">
      </label>

      <button type="submit" id="submit-btn">本を作成する</button>
    </form>
    <p class="note">所要時間：5〜10分（自動生成中はこのページを閉じないでください）</p>
  </section>

  <section id="progress-section" class="hidden">
    <h2>作成中です。少々お待ちください。</h2>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <p id="progress-pct">0%</p>
    </div>
    <p id="progress-message">準備中…</p>
  </section>

  <section id="result-section" class="hidden">
    <h2>完成しました</h2>
    <p id="result-title" class="result-title"></p>
    <p id="result-stats" class="result-stats"></p>
    <div class="downloads">
      <a id="download-md" class="dl-btn">Markdown をダウンロード</a>
      <a id="download-docx" class="dl-btn primary">Word ファイルをダウンロード</a>
    </div>
    <p class="note">Word ファイルは Kindle KDP に直接アップロードできます。</p>
    <button id="reset-btn">もう1冊作る</button>
  </section>

  <section id="error-section" class="hidden">
    <h2>エラーが発生しました</h2>
    <p id="error-message"></p>
    <button id="retry-btn">最初に戻る</button>
  </section>
</main>

<footer>
  <p>Book Maker v1 ── voice.md v7.1 規範準拠 ／ Kindle KDP 入稿対応</p>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
